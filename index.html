<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лесной забег 3D</title>
<style>
:root{--bg:#cfdcb0;--card:#f6f0de;--ink:#2f3a22;--acc:#5f8a35;--line:#cdbf98;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b14;--card:#22301f;--ink:#f0ead2;--acc:#9cc66a;--line:#46563a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121b14;--card:#22301f;--ink:#f0ead2;--acc:#9cc66a;--line:#46563a;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;align-items:center}
#app{position:relative;width:min(100%,400px,calc((100dvh - 16px)*.5625));aspect-ratio:9/16;overflow:hidden;border-radius:18px;background:#cfe9e4}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#hud[hidden]{display:none}
#hud b{background:rgba(38,52,28,.62);color:#fff;font-size:18px;padding:4px 12px;border-radius:16px;min-width:12px}
#hud #hh{background:none;color:#e0455f;font-size:22px;padding:0}
#ui{position:absolute;left:10px;right:10px;background:color-mix(in srgb,var(--card) 94%,transparent);color:var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px;box-sizing:border-box}
#ui[hidden]{display:none}
#ui.bot{bottom:10px}#ui.mid{top:50%;transform:translateY(-50%)}
h1{margin:0;font-size:26px;line-height:1.1}
p{margin:0;line-height:1.45;font-size:14px}
small{opacity:.75;line-height:1.4}
.tabs{display:flex;gap:6px}
.tab,.big{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 6px;color:inherit;font:inherit;cursor:pointer;flex:1;font-size:15px}
.tab.on{border-color:var(--acc);font-weight:bold}
.tab:focus-visible,.big:focus-visible,.tab:hover,.big:hover{border-color:var(--acc);outline:none}
.big{font-size:17px;font-weight:bold;padding:10px;background:var(--acc);color:#fff;border-color:var(--acc)}
.big.alt{background:var(--bg);color:inherit;border-color:var(--line)}
</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas><div id="hud" hidden><b id="hb"></b><b id="hh"></b><b id="hs"></b></div><div id="ui" class="bot"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,LANE=2.4,G=38,H=3.4,PH=1.5,PS=.85;
const $=id=>document.getElementById(id),ui=$('ui'),hud=$('hud'),cv=$('c');
const CH=[
 {n:'Пибл',d:'Прыгает выше всех',jump:1.08,lives:1,ber:1,gait:1.15,bob:1,sway:1},
 {n:'Выдра',d:'Ягоды считаются за две',jump:1,lives:1,ber:2,gait:1,bob:.8,sway:1.6},
 {n:'Капибара',d:'Выдерживает два удара',jump:1,lives:2,ber:1,gait:.85,bob:1.4,sway:.7}
];
const R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.setSize(360,640,false);
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const sc=new T.Scene(),cam=new T.PerspectiveCamera(66,360/640,.1,320);
sc.fog=new T.Fog(0xf3e6c4,30,200);
function cvs(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;return t}
const mc={};const mat=(c,f)=>{const k=c+(f?'f':'');return mc[k]||(mc[k]=f?new T.MeshPhongMaterial({color:c,flatShading:true,shininess:0,specular:0}):new T.MeshLambertMaterial({color:c}))};
const shadowAll=g=>{g.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true}});return g};
// sky and light
sc.background=cvs(2,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#6fb7ea');g.addColorStop(.2,'#bfe3ee');g.addColorStop(.3,'#f3e6c4');g.addColorStop(1,'#f3e6c4');x.fillStyle=g;x.fillRect(0,0,w,h)});
sc.background.wrapS=sc.background.wrapT=T.ClampToEdgeWrapping;
sc.add(new T.HemisphereLight(0xdff1ff,0x7d8f4a,.85));
const sun=new T.DirectionalLight(0xfff0c8,1);sun.position.set(-7,15,7);sun.target.position.set(0,0,-4);sc.add(sun,sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-14,right:14,top:20,bottom:-14,near:1,far:45});sun.shadow.bias=-.0006;
// ground
const dirt=cvs(256,256,(x,w,h)=>{x.fillStyle='#b99565';x.fillRect(0,0,w,h);for(let i=0;i<280;i++){x.fillStyle=`rgba(${90+Math.random()*60|0},${70+Math.random()*40|0},40,.25)`;x.beginPath();x.ellipse(Math.random()*w,Math.random()*h,2+Math.random()*5,1+Math.random()*3,0,0,7);x.fill()}
 x.fillStyle='rgba(107,74,43,.22)';for(const u of[.357,.643])x.fillRect(u*w-2,0,4,h);x.fillStyle='#6b9a3a';x.fillRect(0,0,14,h);x.fillRect(w-14,0,14,h)});
dirt.repeat.set(1,220/8.4);
const grass=cvs(128,128,(x,w,h)=>{x.fillStyle='#6fae45';x.fillRect(0,0,w,h);for(let i=0;i<260;i++){x.fillStyle=Math.random()<.5?'rgba(60,120,40,.35)':'rgba(150,200,90,.35)';x.fillRect(Math.random()*w,Math.random()*h,2,4)}});
grass.repeat.set(30,65);
const path=new T.Mesh(new T.PlaneGeometry(8.4,220).rotateX(-Math.PI/2),new T.MeshLambertMaterial({map:dirt}));path.position.set(0,0,-90);path.receiveShadow=true;sc.add(path);
const lawn=new T.Mesh(new T.PlaneGeometry(120,260).rotateX(-Math.PI/2),new T.MeshLambertMaterial({map:grass}));lawn.position.set(0,-.04,-100);sc.add(lawn);
// far scenery
const sunM=new T.Mesh(new T.SphereGeometry(7,16,12),new T.MeshBasicMaterial({color:0xfff6d0,fog:false}));sunM.position.set(-45,36,-190);sc.add(sunM);
const glow=new T.Mesh(new T.SphereGeometry(15,16,12),new T.MeshBasicMaterial({color:0xfff3c0,transparent:true,opacity:.25,fog:false}));glow.position.copy(sunM.position);sc.add(glow);
[[-90,60,0x86ae7e],[-30,48,0x6f9a6c],[40,64,0x7aa574],[100,52,0x86ae7e],[0,40,0x5f9461]].forEach(([x,r,c],i)=>{const h=new T.Mesh(new T.SphereGeometry(r,18,12),new T.MeshLambertMaterial({color:c}));h.scale.y=.45;h.position.set(x,-14,-168-i%2*8);sc.add(h)});
const clouds=[];for(let i=0;i<7;i++){const g=new T.Group();for(let j=0;j<3;j++){const s=new T.Mesh(new T.SphereGeometry(7+j*2,10,8),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,fog:false}));s.scale.y=.5;s.position.set((j-1)*10,j%2*2,0);g.add(s)}g.position.set(-110+i*36,32+i%3*6,-150-i%2*30);sc.add(g);clouds.push(g)}
// trees
const tg={tr:new T.CylinderGeometry(.28,.38,1.8,6),c1:new T.ConeGeometry(2.1,3.2,7),c2:new T.ConeGeometry(1.7,2.8,7),c3:new T.ConeGeometry(1.2,2.4,7),i1:new T.IcosahedronGeometry(1.9,1),i2:new T.IcosahedronGeometry(1.5,1),b:new T.IcosahedronGeometry(1.1,1)};
function mkTree(){
 const g=new T.Group(),v=Math.random(),M=(geo,c,x,y,z)=>{const m=new T.Mesh(geo,mat(c,1));m.position.set(x,y,z);g.add(m)};
 M(tg.tr,0x6b4a2b,0,.9,0);
 if(v<.45){M(tg.c1,0x2f6a3c,0,3.2,0);M(tg.c2,0x3a7a45,0,4.7,0);M(tg.c3,0x478a4e,0,6,0)}
 else if(v<.8){g.children[0].scale.y=1.5;M(tg.i1,0x3f8a3a,0,4.2,0);M(tg.i2,0x4f9444,1.1,3.5,.4);M(tg.i2,0x358033,-1.1,3.3,-.3)}
 else{g.remove(g.children[0]);M(tg.b,0x4f9444,0,.8,0)}
 return g;
}
const trees=[];
function place(t,z){const s=Math.random()<.5?-1:1;t.position.set(s*(5+Math.random()*10),0,z);t.scale.setScalar(.8+Math.random()*.7);t.rotation.y=Math.random()*6}
for(let i=0;i<52;i++){const t=mkTree();place(t,14-i*3.9+Math.random()*2);sc.add(t);trees.push(t)}
// textures for obstacles
const rings=cvs(128,128,(x,w,h)=>{x.fillStyle='#d9b27a';x.fillRect(0,0,w,h);x.strokeStyle='#a87d45';x.lineWidth=2;for(let r=58;r>4;r-=9){x.beginPath();x.arc(64,64,r,0,7);x.stroke()}});
const doorT=cvs(128,256,(x,w,h)=>{x.fillStyle='#7a4e2c';x.fillRect(0,0,w,h);x.fillStyle='#4a2f18';x.fillRect(24,50,80,206);x.beginPath();x.arc(64,50,40,Math.PI,0);x.fill();x.fillStyle='#e0b050';x.beginPath();x.arc(92,160,5,0,7);x.fill()});
const sideC={};
function sideTex(len){return sideC[len]||(sideC[len]=(()=>{const t=cvs(512,256,(x,w,h)=>{x.fillStyle='#8a5a35';x.fillRect(0,0,w,h);x.strokeStyle='#5f3d22';x.lineWidth=3;for(let y=0;y<h;y+=32){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}
 for(const i of[40,296]){x.fillStyle='#3b2a1a';x.fillRect(i-6,64,128,92);x.fillStyle='#a9d8e8';x.fillRect(i,70,116,80);x.fillStyle='#3b2a1a';x.fillRect(i+56,70,5,80)}});t.repeat.set(len/4,1);return t})())}
// obstacle models
function stump(){const g=new T.Group(),m=new T.Mesh(new T.CylinderGeometry(.8,.92,.9,18),[mat(0x6b4a2b),new T.MeshLambertMaterial({map:rings}),mat(0x4a3320)]);m.position.y=.45;g.add(m);
 const mo=new T.Mesh(new T.SphereGeometry(.3,10,8),mat(0x6f9a45));mo.scale.set(1,.4,1);mo.position.set(.55,.2,.5);g.add(mo);return shadowAll(g)}
function rock(){const g=new T.Group(),m=new T.Mesh(new T.IcosahedronGeometry(1.3,1),mat(0x8d8f87,1));m.scale.set(1,1.2,.95);m.position.y=1.5;g.add(m);
 const mo=new T.Mesh(new T.SphereGeometry(.85,10,8),mat(0x6f9a45,1));mo.scale.set(1,.3,1);mo.position.y=2.85;g.add(mo);
 const r2=new T.Mesh(new T.IcosahedronGeometry(.6,1),mat(0x777a72,1));r2.position.set(.95,.45,.6);g.add(r2);return shadowAll(g)}
function bar(){const g=new T.Group(),w=mat(0x6b4a2b);
 for(const s of[-1,1]){const p=new T.Mesh(new T.CylinderGeometry(.13,.16,1.9,8),w);p.position.set(s*1.15,.95,0);g.add(p)}
 const b=new T.Mesh(new T.BoxGeometry(2.8,.4,.4),w);b.position.y=1.45;g.add(b);
 for(let i=0;i<7;i++){const l=new T.Mesh(new T.IcosahedronGeometry(.28,1),mat(i%2?0x4f9444:0x3f7f3a,1));l.position.set(-1.1+i*.37,1.28+(i%2)*.06,(i%3-1)*.12);g.add(l)}
 return shadowAll(g)}
function wagon(len){const g=new T.Group(),bh=H-.75,st=sideTex(len),sm=new T.MeshLambertMaterial({map:st});
 const sk=new T.Mesh(new T.BoxGeometry(2.1,.35,len),mat(0x3c2a1b));sk.position.y=.175;g.add(sk);
 const b=new T.Mesh(new T.BoxGeometry(2,bh,len),[sm,sm,mat(0x5a3b20),mat(0x3c2a1b),new T.MeshLambertMaterial({map:doorT}),mat(0x7a4e2c)]);b.position.y=.35+bh/2;g.add(b);
 const d=mat(0x4d3a22),rf=new T.Mesh(new T.BoxGeometry(2.35,.4,len+.3),[d,d,mat(0x6f9a45),d,d,d]);rf.position.y=H-.2;g.add(rf);
 for(let i=0;i<Math.floor(len/3);i++){const bu=new T.Mesh(new T.IcosahedronGeometry(.3+Math.random()*.15,1),mat(i%2?0x4f9444:0x5fa04a,1));bu.position.set((Math.random()-.5)*1.4,H+.1,-len/2+1.5+i*3);g.add(bu)}
 return shadowAll(g)}
function ramp(len){const sh=new T.Shape();sh.moveTo(0,0);sh.lineTo(len,0);sh.lineTo(len,H);sh.lineTo(0,0);
 const geo=new T.ExtrudeGeometry(sh,{depth:2,bevelEnabled:false});geo.translate(0,0,-1);geo.rotateY(Math.PI/2);geo.translate(0,0,len/2);
 const g=new T.Group();g.add(new T.Mesh(geo,mat(0xb58a52)),new T.LineSegments(new T.EdgesGeometry(geo),new T.LineBasicMaterial({color:0x5a3b20})));
 const a=Math.atan(H/len);for(let i=1;i<8;i++){const f=i/8.5,p=new T.Mesh(new T.BoxGeometry(2.05,.1,.25),mat(0x8a6238));p.position.set(0,H*f+.05,len/2-f*len);p.rotation.x=a;g.add(p)}
 return shadowAll(g)}
const BG=new T.SphereGeometry(.24,12,10),LG=new T.ConeGeometry(.1,.25,6);
// heroes (3D models built from primitives)
const UG=new T.SphereGeometry(1,22,16),OM=new T.MeshBasicMaterial({color:0x3a2616,side:T.BackSide});
function E(p,col,sx,sy,sz,x,y,z){const m=new T.Mesh(UG,mat(col));m.scale.set(sx,sy,sz);m.position.set(x,y,z);m.castShadow=true;const o=new T.Mesh(UG,OM);o.scale.setScalar(1.06);m.add(o);p.add(m);return m}
const Gp=(p,x,y,z)=>{const g=new T.Group();g.position.set(x,y,z);p.add(g);return g};
function mkHero(k){
 const root=new T.Group(),inn=new T.Group();root.add(inn);
 const Hh={root,inn,legs:[],arms:[],ears:[],tail:null,tail2:null,body:Gp(inn,0,0,0),head:null,sc:1},B=Hh.body,dk=0x2a1f1f;
 if(k===0){
  const cr=0xf0d9a8,bl=0xf8ead0,pk=0xe99aa6;
  E(B,cr,.58,.62,.52,0,.9,0);E(B,bl,.44,.5,.3,0,.82,-.28);
  const h=Hh.head=Gp(B,0,1.7,-.02);E(h,cr,.55,.5,.52,0,0,0);E(h,bl,.28,.2,.26,0,-.12,-.46);E(h,dk,.1,.075,.07,0,-.03,-.7);
  for(const s of[-1,1]){E(h,dk,.075,.1,.05,s*.2,.1,-.47);
   const e=Gp(h,s*.38,.36,0);E(e,cr,.22,.3,.1,0,.14,0);E(e,pk,.14,.2,.06,0,.12,-.07);Hh.ears.push({g:e,s});
   const a=Gp(B,s*.6,1.2,0);E(a,cr,.15,.36,.15,0,-.3,0);Hh.arms.push({g:a,o:s>0?Math.PI:0});
   const l=Gp(B,s*.27,.5,0);E(l,cr,.21,.26,.21,0,-.25,0);E(l,cr,.23,.1,.32,0,-.4,-.07);Hh.legs.push({g:l,o:s>0?0:Math.PI})}
  Hh.tail=Gp(B,0,.7,.5);E(Hh.tail,cr,.09,.09,.24,0,.08,.16);Hh.sc=.8;
 }else if(k===1){
  const br=0x70482a,cr=0xeed3a6;
  E(B,br,.46,.78,.42,0,1,0);E(B,cr,.34,.62,.26,0,.98,-.2);
  const h=Hh.head=Gp(B,0,1.95,-.06);E(h,br,.4,.36,.4,0,0,0);E(h,cr,.26,.19,.2,0,-.1,-.3);E(h,dk,.09,.065,.07,0,-.02,-.5);
  for(const s of[-1,1]){E(h,dk,.06,.08,.045,s*.17,.1,-.37);
   const e=Gp(h,s*.3,.3,0);E(e,br,.1,.1,.07,0,0,0);Hh.ears.push({g:e,s:0});
   const a=Gp(B,s*.45,1.25,-.05);E(a,br,.12,.3,.13,0,-.28,0);Hh.arms.push({g:a,o:s>0?Math.PI:0});
   const l=Gp(B,s*.25,.35,0);E(l,br,.2,.2,.22,0,-.15,0);E(l,br,.22,.08,.34,0,-.3,-.08);Hh.legs.push({g:l,o:s>0?0:Math.PI})}
  const t=Hh.tail=Gp(B,0,.5,.4);E(t,br,.17,.12,.5,0,0,.45);const t2=Hh.tail2=Gp(t,0,0,.85);E(t2,br,.15,.1,.4,0,0,.35);Hh.sc=.78;
 }else{
  const or=0xb9772f,dn=0x5a3b24;
  E(B,or,.66,.62,1,0,.95,.05);E(B,0xc98a3c,.5,.35,.8,0,1.3,.1);
  const h=Hh.head=Gp(B,0,1.25,-1);E(h,or,.44,.42,.5,0,0,0);E(h,dn,.3,.3,.3,0,-.1,-.4);E(h,dk,.14,.1,.08,0,0,-.68);
  for(const s of[-1,1]){E(h,dk,.06,.07,.05,s*.3,.14,-.3);const e=Gp(h,s*.32,.38,.1);E(e,or,.1,.12,.07,0,0,0);Hh.ears.push({g:e,s:0});
   for(const z of[-.6,.6]){const l=Gp(B,s*.38,.55,z);E(l,or,.16,.3,.16,0,-.28,0);E(l,dn,.17,.06,.2,0,-.5,-.03);Hh.legs.push({g:l,o:(s>0)===(z<0)?0:Math.PI})}}
  Hh.tail=Gp(B,0,1,1.05);E(Hh.tail,or,.1,.1,.08,0,0,0);Hh.sc=1.02;
 }
 inn.scale.setScalar(Hh.sc);return Hh;
}
const heroes=CH.map((c,i)=>mkHero(i));
function anim(Hh,o){
 const ph=o.ph;
 Hh.legs.forEach(l=>l.g.rotation.x=o.air?-.7:(o.sl?-1.2:Math.sin(ph+l.o)));
 Hh.arms.forEach(a=>a.g.rotation.x=o.air?-2.4:Math.sin(ph+a.o)*.8);
 Hh.ears.forEach(e=>e.g.rotation.z=-e.s*(.55+Math.sin(ph*2+1)*.18+(o.air?.3:0))+(e.s?0:Math.sin(ph*2)*.1));
 if(Hh.tail)Hh.tail.rotation.y=Math.sin(ph*2)*.6;
 if(Hh.tail2)Hh.tail2.rotation.y=Math.sin(ph*2-1)*.7;
 const run=!o.air&&!o.sl;
 Hh.body.rotation.z=run?Math.sin(ph)*.07*o.sway:0;Hh.body.position.y=run?Math.abs(Math.sin(ph))*.12*o.bob:0;
 Hh.head.rotation.z=run?-Math.sin(ph)*.05:0;
 const r=Hh.root;r.rotation.x=o.tilt+(o.sl?.35:0);r.rotation.y=-o.lean*.45;r.rotation.z=-o.lean*.22;
 let sx=1,sy=1;if(o.sl){sx=1.1;sy=.55}else if(o.air){sx=o.up?.94:1.04;sy=o.up?1.08:.97}else if(o.land>0){const k=o.land/.2;sx=1+.18*k;sy=1-.16*k}
 r.scale.set(sx,sy,sx);
}
let cur=heroes[0],sel=0;sc.add(cur.root);
function pick(i){sc.remove(cur.root);sel=i;cur=heroes[i];cur.root.visible=true;cur.root.position.set(0,0,0);sc.add(cur.root)}
// game state
let S=null,clk=0,last=performance.now(),tx0=0,ty0=0,best=0;
try{best=+localStorage.getItem('forest3d-best')||0}catch(e){}
const tp=new T.Vector3(),tl=new T.Vector3(),lk=new T.Vector3(0,-.4,0);
cam.position.set(0,2.3,5.2);
function menu(){
 if(S)clearW();S=null;hud.hidden=true;pick(sel);
 ui.className='bot';
 ui.innerHTML='<h1>Лесной забег 3D</h1><div class="tabs">'+CH.map((c,i)=>`<button class="tab${i===sel?' on':''}" data-t="${i}">${c.n}</button>`).join('')+`</div><p>${CH[sel].d}. Свайп влево и вправо меняет полосу, вверх прыжок, вниз подкат. Стрелки или WASD тоже работают.</p><small>Пеньки перепрыгивай, под ветками проезжай подкатом, валуны обходи. На вагон можно въехать только по пандусу, зато по крышам вагонов можно бежать и прыгать между ними.</small><button class="big" id="go">Бежать</button><small>Рекорд: ${best} очков</small>`;
 ui.hidden=false;
}
function clearW(){S.obs.forEach(o=>sc.remove(o.m));S.coins.forEach(q=>sc.remove(q.m))}
function start(i){
 if(S)clearW();pick(i);
 S={i,c:CH[i],t:0,dist:0,ber:0,lane:0,li:0,y:0,vy:0,air:false,sl:0,land:0,ph:0,lives:CH[i].lives,inv:0,sp:18,obs:[],coins:[],next:0,over:false,flash:0,shk:0,cy:0,mv:0,tilt:0};
 ui.hidden=true;hud.hidden=false;
}
const score=()=>Math.floor(S.dist)+S.ber*10;
function end(){
 S.over=true;const sc2=score();if(sc2>best){best=sc2;try{localStorage.setItem('forest3d-best',best)}catch(e){}}
 ui.className='mid';
 ui.innerHTML=`<h1>Забег окончен</h1><p>${S.c.n} пробежал ${Math.floor(S.dist)} м и собрал ягод: ${S.ber}.</p><p>Очки: ${sc2}. Рекорд: ${best}.</p><button class="big" id="again">Бежать ещё раз</button><button class="big alt" id="home">Выбрать героя</button>`;
 ui.hidden=false;
}
ui.onclick=e=>{
 const t=e.target.closest('[data-t]');if(t){sel=+t.dataset.t;return menu()}
 if(e.target.closest('#go'))return start(sel);
 if(e.target.closest('#again'))return start(S.i);
 if(e.target.closest('#home'))menu();
};
function act(a){
 if(!S||S.over)return;
 if(a==='l')S.lane=Math.max(-1,S.lane-1);
 else if(a==='r')S.lane=Math.min(1,S.lane+1);
 else if(a==='u'&&!S.air){S.vy=12.5*S.c.jump;S.y+=.02;S.air=true;S.sl=0}
 else if(a==='d'){if(!S.air)S.sl=.7;else S.vy=-20}
}
addEventListener('keydown',e=>{
 const m={arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',' ':'u',arrowdown:'d',s:'d'}[e.key.toLowerCase()];
 if(m){e.preventDefault();if(!e.repeat)act(m)}
});
cv.addEventListener('pointerdown',e=>{tx0=e.clientX;ty0=e.clientY});
cv.addEventListener('pointerup',e=>{
 const dx=e.clientX-tx0,dy=e.clientY-ty0;
 if(Math.max(Math.abs(dx),Math.abs(dy))<20)return act('u');
 act(Math.abs(dx)>Math.abs(dy)?(dx<0?'l':'r'):(dy<0?'u':'d'));
});
function addObs(k,x,z,len){
 const o={k,x,z,len:len||1.6,hw:1.05,h:0};let m;
 if(k==='stump'){m=stump();o.h=.9;o.hw=.8;o.len=1.7}
 else if(k==='rock'){m=rock();o.h=3.1;o.hw=1.25;o.len=2.6}
 else if(k==='bar'){m=bar();o.hw=1.35;o.len=1.2}
 else if(k==='wagon'){m=wagon(len);o.h=H}
 else{m=ramp(len);o.h=H;o.ramp=1}
 m.position.set(x,0,z);sc.add(m);o.m=m;S.obs.push(o);return o;
}
function addBerry(x,y,z){const g=new T.Group(),b=new T.Mesh(BG,mat(0xd6304f)),l=new T.Mesh(LG,mat(0x4f8a2f));l.position.y=.27;g.add(b,l);g.position.set(x,y,z);sc.add(g);S.coins.push({m:g,x,y,z})}
function spawn(){
 const z0=S.t<.2?-70:-170,r=Math.random(),ls=[-1,0,1].sort(()=>Math.random()-.5);
 if(r<.36){
  const RL=7,WL=16,GP=.4,n=Math.random()<.5?2:1,w=Math.random()<.5?2:1,tl=ls.slice(0,n);
  tl.forEach((l,i)=>{const x=l*LANE;if(i===0)addObs('ramp',x,z0-RL/2,RL);for(let j=0;j<w;j++)addObs('wagon',x,z0-RL-WL/2-j*(WL+GP),WL)});
  for(let q=0;q<8;q++)addBerry(tl[0]*LANE,H+1,z0-RL-3-q*2.3);
  for(let q=0;q<6;q++)addBerry(ls[n]*LANE,.9,z0-4-q*2.6);
  return RL+w*(WL+GP);
 }
 const u=(r-.36)/.64,k=u<.4?'stump':u<.7?'bar':'rock',n=k==='rock'?(Math.random()<.4?2:1):(Math.random()<.5?3:1);
 ls.slice(0,n).forEach(l=>addObs(k,l*LANE,z0,0));
 for(let q=0;q<5;q++)addBerry((n===3?ls[0]:ls[n%3])*LANE,.9,z0-8-q*2.5);
 return 8;
}
function crash(){if(S.inv>0||S.over)return;S.lives--;S.inv=1.5;S.flash=.4;S.shk=.5;if(S.lives<=0)end()}
function update(dt){
 const c=S.c;S.t+=dt;S.sp=Math.min(40,18+S.t*.35);
 const mv=S.sp*dt;S.mv=mv;S.dist+=mv*.6;S.ph+=dt*(8+S.sp*.22)*c.gait;
 S.li+=(S.lane-S.li)*Math.min(1,dt*14);const px=S.li*LANE;
 S.sl=Math.max(0,S.sl-dt);S.inv=Math.max(0,S.inv-dt);S.flash=Math.max(0,S.flash-dt);S.land=Math.max(0,S.land-dt);S.shk=Math.max(0,S.shk-dt*2);
 S.next-=mv;if(S.next<=0)S.next=Math.max(20,34-S.t*.12)+spawn();
 for(const o of S.obs){o.z+=mv;o.m.position.z=o.z}
 const ph=S.sl>0?PS:PH;let f=0,ramp=0,hit=false;
 for(const o of S.obs){
  if(Math.abs(o.x-px)>=o.hw+.3)continue;
  const zn=o.z+o.len/2,zf=o.z-o.len/2;if(zf>.3||zn<-.3)continue;
  if(o.k==='bar'){if(S.y<1.7&&S.y+ph>1.2)hit=true;continue}
  const h=o.ramp?H*Math.min(1,Math.max(0,zn/o.len)):o.h;
  if(h>f){f=h;ramp=o.ramp?Math.atan(H/o.len):0}
 }
 S.vy-=G*dt;let ny=S.y+S.vy*dt;
 if(ny<=f){if(f-S.y>(ramp?1.2:.45))hit=true;if(S.vy<-8)S.land=.2;ny=f;S.vy=0}
 S.y=ny;S.air=S.y>f+.03;S.tilt=ramp&&!S.air?ramp*.8:0;
 if(hit)crash();
 for(const q of S.coins){
  q.z+=mv;q.m.position.set(q.x,q.y+Math.sin(S.t*5+q.z)*.1,q.z);q.m.rotation.y=S.t*3;
  if(!q.got&&Math.abs(q.z)<.9&&Math.abs(q.x-px)<1&&Math.abs(S.y+.9-q.y)<1.3){q.got=1;S.ber+=c.ber}
 }
 S.obs=S.obs.filter(o=>{if(o.z-o.len/2>14){sc.remove(o.m);return false}return true});
 S.coins=S.coins.filter(q=>{if(q.got||q.z>8){sc.remove(q.m);return false}return true});
 S.cy+=(S.y*.75-S.cy)*Math.min(1,dt*5);
 const hb=S.ber+'',hs=score()+' очк.';
 if($('hb').textContent!=='🍓 '+hb)$('hb').textContent='🍓 '+hb;
 $('hs').textContent=hs;$('hh').textContent=c.lives>1?'♥'.repeat(Math.max(0,S.lives)):'';
}
function env(mv,dt){
 for(const t of trees){t.position.z+=mv;if(t.position.z>14)place(t,t.position.z-203)}
 dirt.offset.y+=mv/8.4;grass.offset.y+=mv/4;
 for(const c of clouds){c.position.x+=dt*2;if(c.position.x>130)c.position.x=-130}
}
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;clk+=dt;
 let mv=6*dt;
 if(S){if(!S.over)update(dt);mv=S.over?0:S.mv}
 env(mv,dt);
 if(S){
  const px=S.li*LANE;
  cur.root.position.set(px,S.y,0);
  cur.root.visible=!(S.inv>0&&Math.floor(S.t*16)%2);
  anim(cur,{ph:S.ph,air:S.air,up:S.vy>0,sl:S.sl>0&&!S.air,land:S.land,lean:S.lane-S.li,tilt:S.tilt,bob:S.c.bob,sway:S.c.sway});
  const sh=S.shk;
  tp.set(px*.45+(Math.random()-.5)*sh,5.6+S.cy+(Math.random()-.5)*sh,10.8);tl.set(px*.45,.4+S.cy*.8,-6);
 }else{
  anim(cur,{ph:clk*6,air:false,up:false,sl:false,land:0,lean:0,tilt:0,bob:CH[sel].bob,sway:CH[sel].sway});
  const a=clk*.5;tp.set(Math.sin(a)*5.2,2.3,Math.cos(a)*5.2);tl.set(0,-.4,0);
 }
 const k=Math.min(1,dt*(S?9:4));cam.position.lerp(tp,k);lk.lerp(tl,k);cam.lookAt(lk);
 R.render(sc,cam);requestAnimationFrame(loop);
}
menu();requestAnimationFrame(loop);
</script>
</body>
